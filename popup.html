<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X India Checker</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        width: 340px;
        padding: 16px;
        font: 14px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f7f9f9;
        background:
          radial-gradient(circle at top right, rgba(0, 186, 124, 0.2), transparent 38%),
          linear-gradient(180deg, #0f1419, #11161c);
      }

      .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8b98a5;
      }

      h1 {
        margin: 8px 0 6px;
        font-size: 20px;
        line-height: 1.2;
      }

      .subhead,
      .confidence,
      .note {
        margin-top: 8px;
        color: #cfd9de;
      }

      .confidence {
        font-weight: 700;
        color: #f7f9f9;
      }

      ul {
        margin: 12px 0 0;
        padding-left: 18px;
      }

      li + li {
        margin-top: 6px;
      }

      .pill {
        display: inline-flex;
        margin-top: 10px;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.08);
      }

      .pill.likely {
        background: rgba(0, 186, 124, 0.16);
        color: #61e7b8;
      }

      .pill.possible {
        background: rgba(255, 173, 31, 0.16);
        color: #ffd17a;
      }

      .pill.not-india {
        background: rgba(0, 172, 238, 0.16);
        color: #6dcfff;
      }

      button {
        margin-top: 14px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 11px 12px;
        font: inherit;
        font-weight: 700;
        color: #0f1419;
        background: #f7f9f9;
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div class="eyebrow">X India Checker</div>
    <h1 id="summary">Loading…</h1>
    <div id="pill" class="pill">Waiting</div>
    <div id="subhead" class="subhead"></div>
    <div id="confidence" class="confidence"></div>
    <ul id="evidence"></ul>
    <div id="note" class="note"></div>
    <button id="deep-check" type="button">Refresh From X</button>
    <script src="popup.js"></script>
  </body>
</html>
